# Run the whole platform locally with one command:
#   docker compose up --build
# Then open http://localhost:4000  (logins seeded automatically).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage
      POSTGRES_DB: vantage
    volumes:
      - vantage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://vantage:vantage@db:5432/vantage
      JWT_SECRET: change-me-please
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vantage_pgdata:
